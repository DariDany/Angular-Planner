<h2>Edit task</h2>
<form>
    <label>Title: 
        <input type='text' required #taskTitle>
    </label>
    <label>Deadline: 
        <input type="datetime-local" required #taskDeadline>
    </label>
    <button type="button" (click)="editTask(taskTitle.value, taskDeadline.value)" appHighlightButton>Change</button>
</form>
